version: "3.9"
# Sovereign HVAC Thermodynamics — docker-compose
# Usage: docker-compose up --build

services:
  hvac-thermo:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: sovereign-hvac-thermo:latest
    container_name: sovereign-hvac-thermo
    restart: unless-stopped
    ports:
      - "8782:8782"
    environment:
      SBB_ASHRAE_EDITION: ${SBB_ASHRAE_EDITION}
      SBB_CLIMATE_ZONE: ${SBB_CLIMATE_ZONE}
      SBB_UNIT_SYSTEM: ${SBB_UNIT_SYSTEM}
      SBB_REFRIGERANT_TYPE: ${SBB_REFRIGERANT_TYPE}
      SBB_API_KEY: ${SBB_API_KEY:-change-me}
      SBB_N8N_EVENT_BUS_URL: ${SBB_N8N_EVENT_BUS_URL:-http://host.docker.internal:5678/webhook/event-bus}
      SERVICE_PORT: 8782
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./.data:/app/.data:rw
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8782/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - sbb-platform

networks:
  sbb-platform:
    external: true
    name: sbb-platform-network
